name: Security and Performance Baseline

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Secret scan and repository footprint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 2

      - name: Scan latest source change for leaked credentials
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e

      - name: Report tracked repository footprint
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# Repository footprint"
            echo "Measured at: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo "Scope: tracked files only. This is a storage and review signal, not a runtime performance benchmark."
            echo
            echo "## Total apparent size"
            git ls-files -z | xargs -0 -r du -ch --apparent-size -- | tail -n 1
            echo
            echo "## 20 largest tracked paths"
            git ls-files -z | xargs -0 -r du -ah --apparent-size -- | sort -hr | sed -n '1,20p'
          } | tee repository-footprint.txt
