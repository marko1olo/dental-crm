# ВНИМАНИЕ. АВТОМАТИЧЕСКИЙ ЗАПУСК ОТКЛЮЧЁН 2026-08-06: УТЕЧКА СЕКРЕТОВ.
#
# Полное объяснение — в соседнем `pages.yml`. Кратко: `push` + `path: '.'`
# публиковали КОРЕНЬ репозитория на GitHub Pages при каждом коммите в `main`,
# а в корне отслеживаются `local-secrets/ai.env` и `local-secrets/groq.env`
# с ключами Groq, Google и учётными данными SSH-прокси.
#
# Этот файл — почти полный дубликат `pages.yml` и `deploy-gh-pages.yml`. Все три
# сидят в группе конкурентности `pages` и гоняются друг с другом за одну
# публикацию; из них только `deploy-gh-pages.yml` публикует каталог (`docs`),
# а не корень. Скорее всего, два из трёх подлежат удалению — но это решение
# владельца, и принимать его надо ПОСЛЕ ротации ключей.
#
# У этого workflow не было `workflow_dispatch`, а workflow без единого триггера
# невалиден. Поэтому ручной триггер добавлен: он требует осознанного действия
# человека и не срабатывает от коммита.

name: Deploy GitHub Pages

on:
  # ОТКЛЮЧЕНО: этот триггер публиковал корень репозитория вместе с секретами.
  # push:
  #   branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Было `path: '.'` — публикация КОРНЯ репозитория по публичному HTTP.
          # Заменено 2026-08-06 на 'docs'. Полное объяснение — в `pages.yml`.
          #
          # Кратко: отключения автотриггера мало, потому что `workflow_dispatch`
          # остался, и один ручной запуск отдал бы наружу всё отслеживаемое
          # дерево — 3443 пути, запрещённых `.gitignore`. 'docs' — единственный
          # каталог, который в этом репозитории намеренно предназначен для
          # публикации (`deploy-gh-pages.yml`). Возврат к '.' недопустим.
          path: 'docs'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
