# ВНИМАНИЕ. АВТОМАТИЧЕСКИЙ ЗАПУСК ОТКЛЮЧЁН 2026-08-06: УТЕЧКА СЕКРЕТОВ.
#
# ЧТО БЫЛО. Триггер `push` плюс `path: '.'` означали следующее: при каждом
# коммите в главную ветку `actions/checkout` восстанавливал ВСЕ отслеживаемые
# git файлы, а артефакт собирался из КОРНЯ репозитория целиком и отдавался
# публичным HTTP через GitHub Pages.
#
# В корне отслеживаются `local-secrets/ai.env` и `local-secrets/groq.env`:
# правило `.gitignore:30` появилось ПОСЛЕ их коммита, а игнор не снимает файл с
# отслеживания. Внутри — ключи Groq, ключи Google, учётные данные SSH-прокси.
# То есть ключи провайдеров медицинской системы обслуживались веб-сервером.
# Наличие `.nojekyll` в корне подтверждает, что содержимое отдавалось как есть.
#
# ПОЧЕМУ ОТКЛЮЧЕНИЕ, А НЕ УДАЛЕНИЕ. Отключение обратимо и сохраняет намерение
# автора. Отключение НЕ отзывает уже опубликованное — оно лишь не даёт утечке
# перезарядиться при следующем коммите.
#
# ЧТО СДЕЛАТЬ ВЛАДЕЛЬЦУ, В ЭТОМ ПОРЯДКЕ:
#   1. Отозвать и перевыпустить ключи Groq, Google, учётку SSH-прокси.
#   2. Снять `local-secrets/**` с отслеживания (`git rm --cached`).
#   3. Вычистить историю на ОБОИХ зеркалах (origin и gitlab) — только после п.1.
#   4. Решить, нужен ли этот workflow: рядом `deploy-gh-pages.yml` публикует
#      `docs`, а не корень, и сидит в той же группе конкурентности `pages` —
#      три workflow гоняются друг с другом за одну публикацию.
#   5. Если нужен — заменить `path: '.'` на конкретный каталог публикации.
#      Корень репозитория публиковать нельзя никогда.
#
# Ручной `workflow_dispatch` оставлен намеренно: он требует осознанного действия
# человека и не срабатывает от коммита.

name: Deploy GitHub Pages SPA

on:
  # ОТКЛЮЧЕНО: этот триггер публиковал корень репозитория вместе с секретами.
  # push:
  #   branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          # Было `path: '.'` — публикация КОРНЯ репозитория по публичному HTTP.
          # Заменено 2026-08-06 на 'docs'.
          #
          # Отключить автотриггер было недостаточно: `workflow_dispatch` остался,
          # и один ручной запуск отдал бы наружу всё отслеживаемое дерево. На
          # сегодня это 3443 пути, которые `.gitignore` прямо запрещает, включая
          # 270 сгенерированных документов и каталог загрузок с вложениями.
          # Отключённый триггер защищает от случайности, но не от намерения;
          # узкий путь защищает от обоих.
          #
          # 'docs' выбран не произвольно: ровно его публикует соседний
          # `deploy-gh-pages.yml`, то есть это единственный каталог, который в
          # этом репозитории кто-либо намеренно предназначал для публикации.
          # Если публиковать нужно что-то другое — назовите каталог явно.
          # Возврат к '.' недопустим ни при каких условиях.
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
