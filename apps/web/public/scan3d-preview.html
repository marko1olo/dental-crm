<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>DENTE 3D Universal Intraoral Scan Viewer Proof</title>
  <link rel="stylesheet" href="/dente-preview.css">
  <style>
    :root {
      --primary: #0d9488;
      --primary-hover: #0f766e;
      --teal: #0d9488;
      --teal-dark: #0f766e;
    }
    html[data-theme="dark"], html.dark {
      --paper-strong: #090d16;
      --paper: #0f172a;
      --paper-soft: #1e293b;
      --ink: #f8fafc;
      --ink-muted: #94a3b8;
      --muted: #94a3b8;
      --line: #334155;
      --line-subtle: #1e293b;
      background-color: #090d16;
      color: #f8fafc;
    }
    html[data-theme="light"], html.light {
      --paper-strong: #ffffff;
      --paper: #f8fafc;
      --paper-soft: #f1f5f9;
      --ink: #0f172a;
      --ink-muted: #64748b;
      --muted: #64748b;
      --line: #cbd5e1;
      --line-subtle: #e2e8f0;
      background-color: #f8fafc;
      color: #0f172a;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #root { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/scan3d-bundle.js"></script>
</body>
</html>
