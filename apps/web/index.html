<!doctype html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Dental CRM — современная система управления стоматологической клиникой. Автоматизация расписания, электронной медкарты, счетов и аналитики." />
    <meta name="keywords" content="Dental CRM, стоматология, управление клиникой, расписание врачей, ЭМК, CRM" />
    <meta name="theme-color" content="#0d9488" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DENTE" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Dental CRM | Управление клиникой</title>
    <script>
      (function() {
        try {
          var t = localStorage.getItem("dente_theme");
          if (!t) {
            t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          if (t) {
            document.documentElement.setAttribute("data-theme", t);
            if (t === "dark" || t === "night" || t === "ocean" || t === "emerald" || t === "cyber_xray") {
              document.documentElement.classList.add("dark");
            } else {
              document.documentElement.classList.remove("dark");
            }
          }
          var low = localStorage.getItem("dente_low_spec");
          if (low === "true") {
            document.documentElement.setAttribute("data-low-spec", "true");
            document.documentElement.setAttribute("data-hardware-tier", "low");
            document.documentElement.classList.add("low-spec-mode");
          }
        } catch (e) {}
      })();
    </script>
    <style>
      :root {
        --boot-bg: #fdfdfd;
        --boot-title: #111827;
        --boot-subtitle: #0f766e;
        --boot-logo: #0d9488;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --boot-bg: #090d11;
          --boot-title: #ffffff;
          --boot-subtitle: #14b8a6;
          --boot-logo: #14b8a6;
        }
      }
      html.dark,
      [data-theme="dark"],
      [data-theme="night"],
      [data-theme="ocean"],
      [data-theme="emerald"],
      [data-theme="cyber_xray"] {
        --boot-bg: #090d11;
        --boot-title: #ffffff;
        --boot-subtitle: #14b8a6;
        --boot-logo: #14b8a6;
      }
      [data-theme="warm_sand"] {
        --boot-bg: #fefce8;
        --boot-title: #451a03;
        --boot-subtitle: #78350f;
        --boot-logo: #78350f;
      }
      [data-theme="sakura"] {
        --boot-bg: #fff1f2;
        --boot-title: #4c0519;
        --boot-subtitle: #db2777;
        --boot-logo: #db2777;
      }
      [data-theme="calm_teal"] {
        --boot-bg: #f0fdfa;
        --boot-title: #134e4a;
        --boot-subtitle: #0f766e;
        --boot-logo: #0f766e;
      }
      [data-theme="contrast"] {
        --boot-bg: #ffffff;
        --boot-title: #000000;
        --boot-subtitle: #005f56;
        --boot-logo: #005f56;
      }
      body {
        margin: 0;
        background-color: var(--boot-bg);
      }
      .boot-state {
        align-items: center;
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-height: 100vh;
        min-height: 100dvh;
        justify-content: center;
        place-content: center;
        text-align: center;
        background-color: var(--boot-bg);
        color: var(--boot-title);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      .boot-state svg,
      .boot-logo {
        color: var(--boot-logo);
        height: 48px;
        width: 48px;
        justify-self: center;
      }
      .boot-state h1,
      .boot-title {
        margin: 0;
        font-size: 2rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: var(--boot-title);
      }
      .boot-state p,
      .boot-subtitle {
        margin: 0;
        font-size: 1rem;
        font-weight: 600;
        color: var(--boot-subtitle);
      }
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #090d11;
        }
        .boot-state {
          background-color: #090d11;
        }
        .boot-state svg,
        .boot-logo {
          color: #14b8a6;
        }
        .boot-state h1,
        .boot-title {
          color: #ffffff;
        }
        .boot-state p,
        .boot-subtitle {
          color: #14b8a6;
        }
      }
      html.dark body,
      [data-theme="dark"] body,
      [data-theme="night"] body,
      [data-theme="ocean"] body,
      [data-theme="emerald"] body,
      [data-theme="cyber_xray"] body {
        background-color: #090d11;
      }
      [data-theme="warm_sand"] body {
        background-color: #fefce8;
      }
      [data-theme="sakura"] body {
        background-color: #fff1f2;
      }
      [data-theme="calm_teal"] body {
        background-color: #f0fdfa;
      }
      [data-theme="contrast"] body {
        background-color: #ffffff;
      }
      html.dark .boot-state,
      [data-theme="dark"] .boot-state,
      [data-theme="night"] .boot-state,
      [data-theme="ocean"] .boot-state,
      [data-theme="emerald"] .boot-state,
      [data-theme="cyber_xray"] .boot-state {
        background-color: #090d11;
      }
      html.dark .boot-state svg,
      [data-theme="dark"] .boot-state svg,
      html.dark .boot-logo,
      [data-theme="dark"] .boot-logo {
        color: #14b8a6;
      }
      html.dark .boot-state h1,
      [data-theme="dark"] .boot-state h1,
      html.dark .boot-title,
      [data-theme="dark"] .boot-title {
        color: #ffffff;
      }
      html.dark .boot-state p,
      [data-theme="dark"] .boot-state p,
      html.dark .boot-subtitle,
      [data-theme="dark"] .boot-subtitle {
        color: #14b8a6;
      }
    </style>
  </head>
  <body class="antialiased">
    <div id="root">
      <main class="boot-state" aria-busy="true">
        <svg class="boot-logo" viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6V4a2 2 0 0 0-2-2h-1a.2.2 0 1 0 .3.3"/>
          <path d="M8 15v1a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6v-4"/>
          <circle cx="20" cy="10" r="2"/>
        </svg>
        <h1 class="boot-title">DENTE</h1>
        <p class="boot-subtitle">Загрузка CRM</p>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
