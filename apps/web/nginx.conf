server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Не раскрывать версию nginx в заголовках и страницах ошибок.
    server_tokens off;

    # ── Заголовки безопасности ────────────────────────────────────────────────
    # Раньше здесь не было ни одного: приложение можно было встроить в чужой
    # iframe (кликджекинг), браузер угадывал типы содержимого, а любой XSS
    # исполнялся без ограничений. CSP — основной сдерживающий фактор, поэтому
    # ставим его в том числе для случая пропущенной точки внедрения.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), payment=(), usb=(), camera=(self), microphone=(self)" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # 'unsafe-inline' в style-src нужен инлайновым стилям React/Vite;
    # script-src намеренно без 'unsafe-inline' и 'unsafe-eval'.
    # blob: и data: в img-src/media-src нужны предпросмотру DICOM/снимков.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self' ws: wss:; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Ограничение размера загрузки (снимки/DICOM-архивы), чтобы один запрос
    # не выедал диск и память.
    client_max_body_size 256m;

    # Сжатие текстовых ответов.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/wasm image/svg+xml;
    gzip_min_length 1024;

    # Handle SPA routing (fallback to index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html никогда не кэшируем: иначе после деплоя клиенты держат
    # старые ссылки на несуществующие хэшированные бандлы и приложение белеет.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Служебные файлы не отдаём наружу.
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Proxy API requests to the backend service
    location /api/ {
        proxy_pass http://api:4100/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        # Реальный IP клиента нужен серверному rate-limit: без него все запросы
        # выглядят как приходящие с адреса контейнера nginx и лимит общий на всех.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        # Долгие операции: экспорт PDF, распознавание речи, анализ снимков.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
