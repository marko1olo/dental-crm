  </head>
  <body>
    <main class="app-shell dente-redesign" data-collapsed="false">
      <aside class="sidebar" data-collapsed="false"></aside>
      <section class="workspace view-analytics" id="workspace-content">
        <header class="topbar">
          
  <div class="topbar-context">
    <div class="topbar-clinic">
      <p class="eyebrow">вторник · 28 июля 2026</p>
      <h1>Стоматология, 1 кабинет</h1>
    </div>
    <details class="workspace-role-switcher" aria-label="Рабочая роль">
      <summary><span>Роль</span><strong>Владелец</strong></summary>
    </details>
    <details class="workspace-role-switcher recent-patients-header-dropdown">
      <summary><span>Недавние</span><strong>Иванова А. П.</strong></summary>
    </details>
  </div>
          
  <div class="top-actions">
    
  <div class="dnt-actions-mount dnt-actions-mount--header">
    <div id="dnt-actions-host" class="dnt-actions" data-placement="header" role="group" aria-label="Голос и поиск">
      <div class="dnt-actions__slot dnt-actions__notice"></div>
      <div class="dnt-actions__bar">
        
    <div class="dnt-actions__slot">
      <button type="button" class="dnt-actions__control">
        <svg class="dnt-actions__control-icon" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"></svg>
        <span class="dnt-actions__control-text">
          <span class="dnt-actions__control-label">Поиск</span>
          <span class="dnt-actions__control-hint">Найти пациента, раздел или действие</span>
        </span>
      </button>
    </div>
        
    <div class="dnt-actions__slot">
      <button type="button" class="dnt-actions__control dnt-actions__control--primary">
        <svg class="dnt-actions__control-icon" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"></svg>
        <span class="dnt-actions__control-text">
          <span class="dnt-actions__control-label">Голос</span>
          <span class="dnt-actions__control-hint">Держите кнопку и говорите — текст попадёт в карту</span>
        </span>
      </button>
    </div>
        
    <div class="dnt-actions__slot">
      <button type="button" class="dnt-actions__control">
        <svg class="dnt-actions__control-icon" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"></svg>
        <span class="dnt-actions__control-text">
          <span class="dnt-actions__control-label">Справка</span>
          <span class="dnt-actions__control-hint">Какие команды понимает помощник</span>
        </span>
      </button>
    </div>
      </div>
    </div>
  </div>
    <button class="primary-button" type="button" title="Открыть записи и добавить приём"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"></svg> Запись</button>
    <button class="secondary-button compact-top-button" type="button" title="Открыть мастер настройки клиники"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"></svg> Настроить</button>
    <button class="secondary-button compact-top-button" type="button" title="Запереть рабочее место — вернуться можно по ПИН-коду"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"></svg> Заблокировать</button>
  </div>
        </header>
      </section>
    </main>
  </body>
</html>
