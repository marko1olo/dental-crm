id: missing-tenant-isolation
language: typescript
message: Missing organizationId in WHERE clause
severity: error
rule:
  any:
    - pattern: $DB.update($_).set($_).where($COND)
    - pattern: $DB.update($_).where($COND)
    - pattern: $DB.delete($_).where($COND)
  not:
    has:
      pattern: organizationId
