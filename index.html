<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dental-crm — Official Technical Showcase</title>
    <meta name="description" content="Enterprise dental clinic automation with 2D/3D DICOM viewer and KND 1151156 tax drafts.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #091319; --accent: #10b981; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: #f1f5f9; font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; overflow-x: hidden; }
        .hero-box { max-width: 900px; width: 100%; text-align: center; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 3rem 2rem; backdrop-filter: blur(10px); box-shadow: 0 0 50px rgba(0,0,0,0.8), 0 0 30px var(--accent); }
        h1 { font-size: 3.5rem; font-weight: 900; color: #fff; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 0.5rem; text-shadow: 0 0 20px var(--accent); }
        .tag { display: inline-block; background: rgba(255,255,255,0.05); border: 1px solid var(--accent); color: var(--accent); font-weight: 700; padding: 0.4rem 1.2rem; border-radius: 4px; font-size: 0.85rem; margin-bottom: 1.5rem; letter-spacing: 1px; }
        p.desc { font-size: 1.2rem; color: #94a3b8; max-width: 700px; margin: 0 auto 2.5rem; line-height: 1.6; }
        .btn-group { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
        .btn { padding: 1rem 2.2rem; background: var(--accent); color: #000; font-weight: 700; text-decoration: none; border-radius: 6px; font-size: 1rem; transition: all 0.3s; text-transform: uppercase; }
        .btn:hover { background: #fff; box-shadow: 0 0 30px #fff; transform: translateY(-2px); }
        .btn-sec { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.2); }
        .btn-sec:hover { background: rgba(255,255,255,0.1); }
    </style>
</head>
<body>
    <div class="hero-box">
        <h1>dental-crm</h1>
        <div class="tag">POSTGRESQL 18 // DENTE DENTAL CRM & DICOM VIEWER</div>
        <p class="desc">Enterprise dental clinic automation with 2D/3D DICOM viewer and KND 1151156 tax drafts.</p>
        <div class="btn-group">
            <a href="https://github.com/marko1olo/dental-crm" class="btn" target="_blank">🚀 Open GitHub Repo</a>
            <a href="https://github.com/marko1olo/dental-crm#readme" class="btn btn-sec" target="_blank">📖 Read Spec</a>
        </div>
    </div>
</body>
</html>
