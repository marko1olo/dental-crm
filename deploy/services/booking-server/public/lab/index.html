<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Портал зуботехнической лаборатории — DENTE</title>
  <style>
    :root {
      --primary: #0284c7;
      --bg: #0b0f19;
      --surface: #151d2f;
      --border: #26334d;
      --text: #f1f5f9;
      --text-muted: #8492a6;
      --green: #10b981;
      --amber: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
    .title { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
    .status-badge { font-size: 12px; padding: 4px 10px; border-radius: 12px; background: rgba(16, 185, 129, 0.15); color: var(--green); }
    .orders-grid { display: grid; gap: 16px; }
    .order-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
    .order-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .order-id { font-family: monospace; font-size: 14px; color: var(--primary); font-weight: bold; }
    .order-deadline { font-size: 13px; color: var(--amber); }
    .order-info { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; font-size: 13px; }
    .info-label { color: var(--text-muted); font-size: 11px; text-transform: uppercase; }
    .info-val { font-weight: 600; margin-top: 2px; }
    .status-select { padding: 8px 12px; border-radius: 6px; background: #0b0f19; border: 1px solid var(--border); color: var(--text); font-size: 13px; outline: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title">🔬 DENTE • Портал зуботехнической лаборатории (ЗТЛ)</div>
      <div class="status-badge">⚡ Облачный шлюз активен</div>
    </div>

    <div class="orders-grid" id="ordersList">
      <div style="text-align:center; padding: 40px; color: var(--text-muted);">Загрузка нарядов лаборатории...</div>
    </div>
  </div>

  <script>
    async function loadOrders() {
      try {
        const res = await fetch("/api/lab/orders");
        const data = await res.json();
        const container = document.getElementById("ordersList");
        
        container.innerHTML = data.orders.map(o => `
          <div class="order-card" id="card-${o.id}">
            <div class="order-top">
              <div>
                <span class="order-id">${o.id}</span>
                <span style="margin-left: 8px; font-size: 13px; color: var(--text-muted)">Пациент: ${o.patientCode}</span>
              </div>
              <div class="order-deadline">Срок: ${o.deadline}</div>
            </div>
            <div class="order-info">
              <div>
                <div class="info-label">Врач-ортопед</div>
                <div class="info-val">${o.doctorName}</div>
              </div>
              <div>
                <div class="info-label">Зубная формула</div>
                <div class="info-val">${o.teeth}</div>
              </div>
              <div>
                <div class="info-label">Конструкция</div>
                <div class="info-val">${o.type}</div>
              </div>
              <div>
                <div class="info-label">Цвет (VITA)</div>
                <div class="info-val">${o.color}</div>
              </div>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center; border-top:1px solid var(--border); padding-top:12px; margin-top:4px;">
              <span style="font-size: 13px; color: var(--text-muted)">Текущий статус наряда:</span>
              <select class="status-select" onchange="updateStatus('${o.id}', this.value)">
                <option value="modeling" ${o.status==='modeling'?'selected':''}>3D Моделирование (Exocad)</option>
                <option value="milling" ${o.status==='milling'?'selected':''}>Фрезеровка на станке</option>
                <option value="layering" ${o.status==='layering'?'selected':''}>Нанесение керамики</option>
                <option value="ready" ${o.status==='ready'?'selected':''}>Готово к примерке</option>
              </select>
            </div>
          </div>
        `).join("");
      } catch (err) {
        document.getElementById("ordersList").innerHTML = "<div style='color:red; text-align:center;'>Ошибка загрузки нарядов</div>";
      }
    }

    async function updateStatus(id, newStatus) {
      try {
        await fetch(`/api/lab/orders/${id}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ status: newStatus })
        });
        alert(`Статус наряда ${id} обновлен! Клиника уведомлена.`);
      } catch (e) {
        alert("Сбой обновления статуса");
      }
    }

    loadOrders();
  </script>
</body>
</html>
