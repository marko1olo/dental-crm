services:
  # Database
  postgres:
    image: postgres:16-alpine
    container_name: dental-crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER обязателен}
      # БЫЛО: пароль по умолчанию "dental". СТАЛО: обязательная переменная,
      # иначе compose откажется стартовать.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен}
      POSTGRES_DB: ${POSTGRES_DB:-dental_crm}
    # Порт БД больше не публикуется наружу: раньше 5432 торчал на всех
    # интерфейсах хоста с паролем dental/dental. Доступ к базе — только из
    # docker-сети. Для локальной отладки: docker compose exec postgres psql ...
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dental} -d ${POSTGRES_DB:-dental_crm}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # API Backend
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: dental-crm-api
    command: sh -c "npm run db:migrate && node dist/server.js"
    restart: unless-stopped
    # API доступен только через nginx (сервис web), а не напрямую с хоста:
    # прямой доступ обходит заголовки безопасности и передачу реального IP.
    expose:
      - "4100"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://${POSTGRES_USER:?POSTGRES_USER обязателен}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен}@postgres:5432/${POSTGRES_DB:-dental_crm}
      # БЫЛО: значение по умолчанию "my_super_secret_key_change_me_in_production",
      # то есть в проде токены подписывались общеизвестной строкой и любой мог
      # выпустить себе токен администратора любой клиники.
      - AUTH_TOKEN_SECRET=${AUTH_TOKEN_SECRET:?AUTH_TOKEN_SECRET обязателен, задайте случайную строку >= 32 символов}
      - DENTE_CLINICAL_ADMIN_SECRET=${DENTE_CLINICAL_ADMIN_SECRET:?DENTE_CLINICAL_ADMIN_SECRET обязателен}
      - WEB_ORIGIN=${WEB_ORIGIN:?WEB_ORIGIN обязателен, например https://crm.example.ru}
      - API_HOST=0.0.0.0
      - API_PORT=4100
      # Реальный IP клиента приходит от nginx — нужен серверному rate-limit.
      - TRUST_PROXY=1
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://0.0.0.0:4100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Web Frontend (Nginx serving Vite static build)
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: dental-crm-web
    restart: unless-stopped
    ports:
      # По умолчанию слушаем только localhost: публикация наружу должна быть
      # осознанной и, для медицинских данных, только через HTTPS-терминатор.
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
